# Render Blueprint for the RELAY web app.
# Apply with: Render Dashboard → New → Blueprint → this repository.
# Contract deployment stays off the host. Do not add DEPLOYER_PRIVATE_KEY here.

services:
  - type: web
    name: relay
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_CHAIN_ENV
        value: testnet
      - key: NEXT_PUBLIC_MEZO_TESTNET_RPC_URL
        value: https://rpc.test.mezo.org
      - key: NEXT_PUBLIC_MUSD_TESTNET_ADDRESS
        value: "0x118917a40FAF1CD7a13dB0Ef56C86De7973Ac503"
      - key: NEXT_PUBLIC_ESCROW_TESTNET_ADDRESS
        value: "0x22535C947Fd951bbC6C03f8D8A1159ad3a159c46"
      - key: NEXT_PUBLIC_ESCROW_LEGACY_ADDRESS
        value: "0xcf6a53b0A22989Ad6B1834C7844CfB9B0d3A9125"
      - key: NEXT_PUBLIC_EXPLORER_BASE_URL
        value: https://explorer.test.mezo.org
      - key: NEXT_PUBLIC_ESCROW_DEPLOY_BLOCK
        value: "16358867"
